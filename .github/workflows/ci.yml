- name: Validate submission artifacts
  run: |
    python - <<'PY'
    from pathlib import Path
    import numpy as np
    import pandas as pd

    expected = {
        "submissions/Results_33_T3_0.csv": "PPP_WTG17",
        "submissions/Results_33_T3_1.csv": "PPP_WTG17",
        "submissions/Results_33_T3_final.csv": "SSS_WTG06",
    }

    required_columns = [
        "turbine_id",
        "date",
        "yaw_misalignment_deg",
        "cluster",
    ]

    for filename, turbine_id in expected.items():
        path = Path(filename)
        assert path.exists(), f"Missing {filename}"

        df = pd.read_csv(path)

        assert len(df) == 731, f"{filename}: expected 731 rows, got {len(df)}"
        assert list(df.columns) == required_columns, (
            f"{filename}: unexpected columns {list(df.columns)}"
        )

        assert df["turbine_id"].nunique() == 1
        assert df["turbine_id"].iloc[0] == turbine_id

        dates = pd.to_datetime(df["date"])
        assert dates.nunique() == 731, f"{filename}: duplicate dates"
        assert dates.min() == pd.Timestamp("2023-01-01")
        assert dates.max() == pd.Timestamp("2024-12-31")

        yaw = pd.to_numeric(df["yaw_misalignment_deg"], errors="coerce")
        assert np.isfinite(yaw).all(), f"{filename}: non-finite yaw"
        assert (yaw.abs() <= 90).all(), f"{filename}: yaw outside ±90°"

        cluster = df["cluster"]
        assert cluster.isna().all() or cluster.notna().all(), (
            f"{filename}: cluster must be fully empty or fully filled"
        )

        print(
            f"OK: {filename} — "
            f"{len(df)} rows, "
            f"{yaw.nunique()} yaw levels, "
            f"{cluster.nunique()} clusters"
        )
    PY